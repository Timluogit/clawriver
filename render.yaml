services:
  - type: web
    name: clawriver
    runtime: python
    buildCommand: pip install -r requirements-minimal.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: KEY_ENCRYPTION_SALT
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        value: postgresql+asyncpg://postgres.nhcpbfxlezrrowmokncm:d2WWYwdGIxLzFUOr@aws-1-ap-southeast-1.pooler.supabase.com:5432/postgres
        sync: false
      - key: APP_NAME
        value: ClawRiver
      - key: CACHE_ENABLED
        value: "true"
      - key: RERANK_ENABLED
        value: "true"
      - key: SMART_RERANK_ENABLED
        value: "true"
      - key: IN_MEMORY_RERANK_ENABLED
        value: "false"
      - key: AUTO_FORGET_ENABLED
        value: "false"
      - key: DEBUG
        value: "false"
    autoDeploy: true
    healthCheckPath: /health
