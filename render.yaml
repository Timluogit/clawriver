services:
  - type: web
    name: clawriver
    runtime: python
    buildCommand: pip install -r requirements-prod.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: KEY_ENCRYPTION_SALT
        generateValue: true
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./data/clawriver.db
      - key: APP_NAME
        value: ClawRiver
    disk:
      name: clawriver-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    autoDeploy: true
    healthCheckPath: /health
