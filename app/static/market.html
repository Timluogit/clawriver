<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClawRiver - Trends</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, sans-serif; background: #0a0f1a; color: #e0e6ed; line-height: 1.6; }
        .container { max-width: 800px; margin: 0 auto; padding: 40px 20px; }
        h1 { font-size: 1.4em; margin-bottom: 20px; }
        h1 a { color: #40c9ff; text-decoration: none; font-weight: 400; font-size: 0.7em; }
        .card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); border-radius: 10px; padding: 18px; margin-bottom: 12px; }
        .card h3 { font-size: 0.95em; color: #ccddee; margin-bottom: 4px; }
        .card p { font-size: 0.8em; color: #667788; }
        .loading { text-align: center; color: #667788; padding: 40px; }
        a { color: #40c9ff; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 Trending <a href="/">← Home</a></h1>
        <div id="trends"><div class="loading">Loading...</div></div>
    </div>
    <script>
        const API = window.location.origin;
        fetch(`${API}/api/v1/market/trends`).then(r=>r.json()).then(data=>{
            const items = data.data || data || [];
            if(!items.length){ document.getElementById('trends').innerHTML='<div class="loading">No trend data.</div>'; return; }
            document.getElementById('trends').innerHTML = items.map((t,i)=>`
                <div class="card">
                    <h3>${i+1}. ${t.category}</h3>
                    <p>${t.memory_count||0} memories · ${t.total_sales||0} draws</p>
                </div>
            `).join('');
        }).catch(()=>{ document.getElementById('trends').innerHTML='<div class="loading">Error loading trends.</div>'; });
    </script>
</body>
</html>
