name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 0 * * 1"  # Weekly on Monday at 00:00 UTC

jobs:
  # Stage 1: Code Quality
  code-quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.14"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --break-system-packages black ruff pytest coverage pip-audit

      - name: Lint with ruff
        run: ruff check app/ tests/

      - name: Check formatting with black
        run: black --check app/ tests/

  # Stage 2: Security
  security:
    runs-on: ubuntu-latest
    needs: [code-quality]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run trufflehog for secrets detection
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ""
          head: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install --break-system-packages pip-audit

      - name: Run pip-audit for dependency vulnerabilities
        run: pip-audit --requirement requirements.txt --requirement requirements-prod.txt || true  # Allow failure for now, adjust as needed

  # Stage 3: Testing
  test:
    runs-on: ubuntu-latest
    needs: [security]
    strategy:
      matrix:
        python-version: ["3.14"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --break-system-packages -r requirements.txt -r requirements-prod.txt
          pip install --break-system-packages pytest coverage pytest-asyncio

      - name: Run tests with coverage
        run: |
          coverage run -m pytest tests/
          coverage report -m
          coverage xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  # Stage 4: Build
  build:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t clawriver:latest .
